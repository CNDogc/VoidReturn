# Only worlds listed here trigger void detection. Add one section per world.
# fallback is used when a player has no recorded cross-world source yet.
enabled-worlds:
  spawn:
    void-threshold: -64
    cooldown-secs: 3
    # Countdown before teleporting back (in seconds). 0 = instant rescue.
    delay-secs: 3
    fallback:
      x: 0.5
      y: 70.0
      z: 0.5
      yaw: 0
      pitch: 0
    # [传送前] 倒计时消息：玩家下坠期间每秒发送，{seconds} = 剩余秒数（自动倒计时）。
    # Forms: TITLE, SUBTITLE, ACTION_BAR, CHAT, BOSS_BAR（可多种同时）
    countdown:
      - type: TITLE
        text: "&6正在前往伊甸"
      - type: SUBTITLE
        text: "&e虚空回溯中..."
      - type: ACTION_BAR
        text: "&e{seconds} 秒后传送"
      - type: CHAT
        text: "&a即将传回来源位置..."
      - type: BOSS_BAR
        text: "&6虚空回溯"
    # [传送后] 到达消息：传回完成后发送一次。格式与 countdown 相同。
    arrival:
      - type: TITLE
        text: "&6虚空回溯"
      - type: SUBTITLE
        text: "&e你已被传送回来源位置"
      - type: CHAT
        text: "&a已传回来源位置"
